<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Superhéroes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>


  <header class="header">
    <h1 class="header__title">Buscador de Superhéroes</h1>
    <form id="search-form" class="search-bar">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Ej: Batman, Spider-Man..." 
        required 
      />
      <button type="submit" id="search-btn">Buscar</button>
    </form>
  </header>

  <main class="main-content">

    <section class="controls">
      <p class="results-count">Resultados: <span id="total-results">0</span></p>
      
      <div class="sorting">
        <label for="sort-select">Ordenar por:</label>
        <select id="sort-select">
          <option value="asc">A - Z</option>
          <option value="desc">Z - A</option>
        </select>
      </div>
    </section>


    <section id="heroes-section" class="heroes-container">
      <div id="heroes-grid" class="heroes-grid">
    
      </div>

      <nav class="pagination" aria-label="Navegación de páginas">
        <button id="btn-first" class="pagination__btn" title="Primera página">&laquo;</button>
        <button id="btn-prev" class="pagination__btn" title="Página anterior">&lsaquo;</button>
        <span id="page-indicator" class="pagination__indicator">Página 1</span>
        <button id="btn-next" class="pagination__btn" title="Página siguiente">&rsaquo;</button>
        <button id="btn-last" class="pagination__btn" title="Última página">&raquo;</button>
      </nav>
    </section>

   
    <section id="hero-detail-section" class="hero-detail hidden">
      <button id="btn-back" class="btn-back">&larr; Volver al listado</button>
      <article id="hero-detail-card" class="detail-card">

      </article>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
